[project]
name = "portal-makermods"
version = "0.1.0"
description = "Human-in-the-loop robot learning with LiveKit Portal on a pair of MakerMods Metal arms."
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-portal[rerun,lerobot]>=0.3.0",
    "livekit-api>=0.7",
    "lerobot[hardware]>=0.6.1",
    "numpy>=1.24",
    "python-dotenv>=1",
    "pyyaml>=6",
    "opencv-python>=4.5",
    "pynput>=1.7",
    "dreamlabs>=1.0.23",        # the `robots` arm driver and `dreamcli`
    "dreamlabs-client>=1.0.14",  # the `dream` client (Dream-1)
]

# `uv run robot`, `uv run teleoperator`, `uv run recorder`, `uv run dream-1`, `uv run dream-1-tasks`, `uv run act`,
# `uv run --group voice voice-agent`, and `uv run --group monitor task-monitor`
[project.scripts]
robot = "robot:run"
robot-rebot = "robot_rebot:run"
teleoperator = "teleoperator:run"
recorder = "recorder:run"
dream-1 = "policies.dream_1.run:run"
dream-1-tasks = "policies.dream_1_tasks.run:run"
act = "policies.act.run:run"
voice-agent = "voice_agent:run"
hand-teleop = "hand_teleop:run"
task-monitor = "task_monitor:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["robot", "robot_rebot", "teleoperator", "recorder", "voice_agent", "hand_teleop", "task_monitor"]
packages = ["utils", "policies", "policies.act", "policies.dream_1", "policies.dream_1_tasks"]

[dependency-groups]
# Seeed B601-DM's Damiao serial bridge or SocketCAN adapter.
rebot = ["motorbridge==0.5.6"]
# Training alone needs no robot, LiveKit connection, or desktop input.
train = ["lerobot[training]>=0.6.1"]
# The voice agent (`uv run --group voice voice-agent`): LiveKit Agents and its ai-coustics noise cancellation.
voice = ["livekit-agents~=1.8", "livekit-plugins-ai-coustics~=0.3"]
# Webcam hand tracking for `uv run --group hands hand-teleop`.
hands = ["mediapipe>=1.2"]
# The task monitor (`uv run --group monitor task-monitor`): LeRobot's TOPReward, which loads a Qwen3-VL model.
monitor = ["lerobot[topreward]>=0.6.1"]
