[project]
name = "portal-makermods"
version = "0.1.0"
description = "Human-in-the-loop robot learning with LiveKit Portal on a pair of MakerMods Metal arms."
requires-python = ">=3.15,<3.16"
dependencies = [
    "livekit-portal[rerun,lerobot]>=0.3.0",
    "livekit-api>=0.7",
    "lerobot[hardware]>=0.6.1",
    "numpy>=1.24",
    "python-dotenv>=1",
    "opencv-python>=4.5",
    "pynput>=1.7",
    "dreamlabs>=1.0.23",        # the `robots` arm driver and `dreamcli`
    "dreamlabs-client>=1.0.14",  # the `dream` client (Dream-1)
]

# `uv run robot`, `uv run teleoperator`, `uv run recorder`, `uv run dream-1`, `uv run act`
[project.scripts]
robot = "robot:run"
teleoperator = "teleoperator:run"
recorder = "recorder:run"
dream-1 = "policies.dream_1.run:run"
act = "policies.act.run:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["robot", "teleoperator", "recorder"]
packages = ["utils", "policies", "policies.act", "policies.dream_1"]

[dependency-groups]
# Training alone needs no robot, LiveKit connection, or desktop input.
train = ["lerobot[training]>=0.6.1"]
